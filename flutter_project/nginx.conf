server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Logs
    access_log /dev/stdout;
    error_log /dev/stderr info;

    location /api/ {
            proxy_pass ${API_HOST};
        }

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    error_page 404 /index.html;
}
